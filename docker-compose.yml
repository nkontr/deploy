# =====================================================================
# Экосистема коммерческого блока — общий docker-compose.
# Запуск всего продукта 1 (Радар):      docker compose up -d --build
# С нуля (пересоздать БД и сид):        docker compose down -v && docker compose up -d --build
# Продукт 2 (добавится notifier):       docker compose --profile product2 up -d --build
#
# Файл ведёт техлид (Java #2). Участники меняют только свой блок и только через PR.
# Все пароли имеют dev-значения по умолчанию, поэтому .env не обязателен.
# =====================================================================

services:

  # ------------------------------------------------------------------
  # PostgreSQL: роли, схемы, все таблицы и сид создаются при первом старте
  # (infra/db/init/*). Ведёт: Java #2 (техлид)
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: radar-postgres
    environment:
      POSTGRES_DB: radar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_dev}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:-core_dev}
      ETL_DB_PASSWORD: ${ETL_DB_PASSWORD:-etl_dev}
      NOTIFY_DB_PASSWORD: ${NOTIFY_DB_PASSWORD:-notify_dev}
      CALC_DB_PASSWORD: ${CALC_DB_PASSWORD:-calc_dev}
    volumes:
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # только для отладки с хоста
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d radar"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Python — ETL-сервис :8084: нормализует etl.raw_* -> core.*
  # При старте грузит данные, если успешной загрузки ещё не было (AUTO_LOAD=if-empty).
  # Готовность — etl.load_run.status = 'ok'. Перезалить без пересборки —
  # POST /internal/etl/load (см. etl/README.md).
  # Наружу порт не пробрасываем: /internal/* — только для docker-сети. Ведёт: Python
  # ------------------------------------------------------------------
  etl:
    build: ./etl
    container_name: radar-etl
    environment:
      PORT: "8084"
      DATABASE_URL: postgresql://etl_loader:${ETL_DB_PASSWORD:-etl_dev}@postgres:5432/radar
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-internal_dev_token}
      # Адреса юрлиц из ЕГРЮЛ (dadata.ru, бесплатно 10 000 запросов в сутки); пусто — точки остаются условными
      DADATA_API_KEY: ${DADATA_API_KEY:-}
      DADATA_DAILY_LIMIT: ${DADATA_DAILY_LIMIT:-9000}
      DADATA_WORKERS: ${DADATA_WORKERS:-4}         # параллельных запросов; предел DaData — 30 в секунду
      AUTO_LOAD: if-empty
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Go — auth-service: вход, 2FA, JWT. Ведёт: Go
  # ------------------------------------------------------------------
  auth-service:
    build: ./auth-service
    container_name: radar-auth
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://auth_svc:${AUTH_DB_PASSWORD:-auth_dev}@postgres:5432/radar?sslmode=disable
      JWT_KEY_PATH: /keys/jwt-private.pem          # нет файла -> сервис создаст ключ сам
      ACCESS_TOKEN_TTL: 8h
      MFA_TOKEN_TTL: 5m
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-internal_dev_token}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@rt.ru}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-Demo2026!}
      DEMO_TOTP_SECRET: ${DEMO_TOTP_SECRET:-JBSWY3DPEHPK3PXP}
      ADMIN_USER_EMAIL: ${ADMIN_USER_EMAIL:-admin@rt.ru}
      ADMIN_USER_PASSWORD: ${ADMIN_USER_PASSWORD:-Admin2026!}
    volumes:
      - auth-keys:/keys
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------
  # auth-stub: ПОДМЕНА auth-service для разработки, пока Go не готов.
  # Отдаёт /health и тестовый JWKS (contracts/dev-keys), входа нет —
  # токен выпускает contracts/dev-keys/mint-token.sh.
  #   docker compose --profile auth-stub up -d --build postgres auth-stub core-api
  # НЕ поднимать вместе с auth-service: оба отвечают на имя auth-service.
  # Ведёт: техлид
  # ------------------------------------------------------------------
  auth-stub:
    profiles: ["auth-stub"]
    image: nginx:1.27-alpine
    container_name: radar-auth-stub
    volumes:
      - ./contracts/dev-keys/auth-stub.conf:/etc/nginx/conf.d/default.conf:ro
      - ./contracts/dev-keys/jwks.json:/keys/jwks.json:ro
    ports:
      - "127.0.0.1:${AUTH_STUB_PORT:-18081}:8081"   # для запуска из IDE: AUTH_JWKS_URL=http://localhost:18081/internal/auth/jwks
      # (не 8081: на Windows Hyper-V часто резервирует диапазон ~7900-8200)
    networks:
      default:
        aliases: [auth-service]
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Java — core-api: радар (и навигатор в продукте 2). Ведут: Java #1, Java #2
  # ------------------------------------------------------------------
  core-api:
    build: ./core-api
    container_name: radar-core
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/radar?currentSchema=core
      SPRING_DATASOURCE_USERNAME: core_svc
      SPRING_DATASOURCE_PASSWORD: ${CORE_DB_PASSWORD:-core_dev}
      AUTH_JWKS_URL: http://auth-service:8081/internal/auth/jwks
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-internal_dev_token}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Python — calc-service: калькулятор :8085. Ведёт: Python
  # ------------------------------------------------------------------
  calc-service:
    build: ./calc-service
    container_name: radar-calc
    environment:
      PORT: "8085"
      DATABASE_URL: postgresql://calc_svc:${CALC_DB_PASSWORD:-calc_dev}@postgres:5432/radar
      CORE_API_URL: http://core-api:8080
      AUTH_JWKS_URL: http://auth-service:8081/internal/auth/jwks
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-internal_dev_token}
      ETL_URL: http://etl:8084          # «Обновить цены»: парсинг цен живёт в ETL
    ports:
      - "127.0.0.1:${CALC_PORT:-8085}:8085"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------
  # C# — export-service: CSV / CRM (и калькулятор в резерве). Ведёт: C#
  # ------------------------------------------------------------------
  export-service:
    build: ./export-service
    container_name: radar-export
    environment:
      ASPNETCORE_URLS: http://+:8082
      CORE_API_URL: http://core-api:8080
      AUTH_JWKS_URL: http://auth-service:8081/internal/auth/jwks
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-internal_dev_token}
      # Резерв (модуль 3), пока не используется:
      CALC_DB: Host=postgres;Port=5432;Database=radar;Username=calc_svc;Password=${CALC_DB_PASSWORD:-calc_dev};Search Path=calc
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Java — notifier: подписки, лента, Telegram. ПРОДУКТ 2, по умолчанию не стартует:
  #   docker compose --profile product2 up -d --build
  # Ведёт: Java #2 (техлид)
  # ------------------------------------------------------------------
  notifier:
    profiles: ["product2"]
    build: ./notifier
    container_name: radar-notifier
    environment:
      SERVER_PORT: "8083"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/radar?currentSchema=notify
      SPRING_DATASOURCE_USERNAME: notify_svc
      SPRING_DATASOURCE_PASSWORD: ${NOTIFY_DB_PASSWORD:-notify_dev}
      CORE_API_URL: http://core-api:8080
      AUTH_JWKS_URL: http://auth-service:8081/internal/auth/jwks
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-internal_dev_token}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      CHECK_INTERVAL: 60s
    # На демо-сервере до api.telegram.org доходит только IPv6 и этот IPv4 (149.154.166.110 режется),
    # а у контейнеров только IPv4 — без этого бот висит на «Connect timed out»
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------
  # nginx: единая точка входа + статика фронта (собирается из ./frontend).
  # Ведут: Java #2 (конфиг), Фронт (сборка)
  # ------------------------------------------------------------------
  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    container_name: radar-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
    # depends_on намеренно нет: nginx резолвит сервисы в момент запроса,
    # поэтому можно поднять часть системы (например, без export-service).
    restart: unless-stopped

volumes:
  pgdata:
  auth-keys:
